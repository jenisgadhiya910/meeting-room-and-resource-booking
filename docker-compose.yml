services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
    ports:
      # Published on the host only so `yarn db:studio` / `yarn dev` on the host
      # can reach it — `web` talks to it over the compose network as `db:5432`.
      # Host port is configurable because 5432 is commonly already taken by a
      # local Postgres install.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-meeting_rooms}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built from the POSTGRES_* values rather than read from .env's
      # DATABASE_URL, which points at localhost:$POSTGRES_PORT for host-side
      # tooling — inside the network the database is `db` on its own 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-meeting_rooms}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env (at least 32 characters)}
    ports:
      - '3000:3000'

volumes:
  db-data:
