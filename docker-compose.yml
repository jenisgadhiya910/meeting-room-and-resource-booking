services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
    ports:
      # Host port is configurable — 5432 is commonly already taken by a local
      # Postgres install. The container always listens on 5432 internally.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-meeting_rooms}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-data:
